services:
  postgres:
    image: postgres:16-alpine
    container_name: dpasis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dpasis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dpasis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: dpasis-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dpasis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dpasis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Todas as variáveis vêm do `.env.production` do host (gitignored), como o compose de
    # desenvolvimento já fazia. A lista manual anterior omitia `SECRETS_ENCRYPTION_KEY`,
    # `GISS_CERT_PATH` e `GISS_PROVIDER_ENABLED`: o boot passava — a flag Giss tem
    # `default(false)` no Joi — e a emissão só falhava depois, em runtime.
    env_file:
      - .env.production
    environment:
      # Só o que precisa apontar para a rede do compose sobrescreve o arquivo.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-dpasis}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - dpasis-network
    volumes:
      # Certificados Inter (upload pelo CRUD de bancos) e A1 Giss. O `:rw` permite o admin gravar o
      # PFX/CRT em `resources/files/bank-payment/{id}/`. Templates versionados ficam fora deste mount.
      - ./resources/files:/app/resources/files:rw
    # `migrate deploy`, não `db push`: o índice único parcial `nfses_one_active_per_nfm` — a garantia
    # de banco de que uma NFM não tem duas NFS-e vivas — não é expressável no schema Prisma e existe
    # só no SQL da migration. Com `db push` o banco nasce sem ele, e a proteção contra nota duplicada
    # passa a existir apenas no código.
    command: sh -c "npx prisma migrate deploy && node dist/src/main"

networks:
  dpasis-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
